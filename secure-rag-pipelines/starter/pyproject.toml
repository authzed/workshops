[project]
name = "secure-rag-pipelines"
version = "0.1.0"
description = "Secure RAG pipelines with pre/post-filter authorization using Qdrant and SpiceDB"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "fastembed>=0.3.0",
    "langgraph>=0.0.20",
    "qdrant-client>=1.12,<2",
    "authzed>=1.0,<2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentic_rag", "agentic_rag.nodes"]

[tool.pytest.ini_options]
markers = ["integration: requires docker compose infra + setup_environment"]
